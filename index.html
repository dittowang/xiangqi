<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>象棋 · 千里江山</title>
    <style>
      /* The only hand-written CSS in the project: a black-out shell so the
         canvas owns every pixel. All HUD is painted in-scene, never DOM. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0a08; }
      body { -webkit-font-smoothing: antialiased; touch-action: none; user-select: none; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; outline: none; }
      /* Boot veil: an ink wash that lifts once the first frame is composited. */
      #veil {
        position: fixed; inset: 0; z-index: 10; background: #0b0a08;
        display: flex; align-items: center; justify-content: center;
        transition: opacity 900ms cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      #veil.lifted { opacity: 0; pointer-events: none; }
      #veil canvas { width: 220px; height: 220px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="veil"><canvas id="veil-mark" width="440" height="440"></canvas></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
